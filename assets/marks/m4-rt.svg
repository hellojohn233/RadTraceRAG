<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="RadTraceRAG">
  <title>RadTraceRAG — RT 合体</title>
  <desc>R 与 T 共享顶部横杠：横杠同时是 R 的顶和 T 的横，左边垂下的是 R，右边朱砂竖是 T。</desc>
  <!-- 共享横杠：既是 T 的横，也是 R 的顶 -->
  <rect x="4.2" y="3.6" width="15.8" height="2.4" fill="#16202E"/>
  <!-- R 的竖 -->
  <rect x="4.2" y="3.6" width="2.4" height="16.8" fill="#16202E"/>
  <!-- T 的竖（朱砂） -->
  <rect x="17.6" y="3.6" width="2.4" height="16.8" fill="#C0472B"/>
  <!-- R 的碗：接在竖笔右侧的半圆 -->
  <path d="M 6.6 6 L 10.2 6 A 2.6 2.6 0 0 1 10.2 11.2 L 6.6 11.2"
        fill="none" stroke="#16202E" stroke-width="2.4" stroke-linejoin="miter"/>
  <!-- R 的斜腿 -->
  <path d="M 7.6 11.2 L 14.2 20.4"
        fill="none" stroke="#16202E" stroke-width="2.4" stroke-linecap="butt"/>
</svg>
