<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="RadTraceRAG">
  <title>RadTraceRAG</title>
  <defs>
    <linearGradient id="rt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111C2E"/>
      <stop offset="55%" stop-color="#0A101B"/>
      <stop offset="100%" stop-color="#060A11"/>
    </linearGradient>
    <linearGradient id="rt-trace" x1="0.08" y1="0.05" x2="0.92" y2="0.95">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="48%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B93F8"/>
    </linearGradient>
    <radialGradient id="rt-hit-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FBBF24" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rt-scan" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#8FB6D9" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#5B7FA8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#5B7FA8" stop-opacity="0"/>
    </radialGradient>
    <filter id="rt-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 底板 -->
  <rect width="512" height="512" rx="116" fill="url(#rt-bg)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#26374F" stroke-width="3"/>

  <!-- 影像视野：环内淡光 + 灰阶团块 -->
  <circle cx="256" cy="250" r="126" fill="url(#rt-scan)"/>
  <path d="M196 214c14-26 52-36 78-20s34 44 20 66-52 34-76 18-36-40-22-64z" fill="#9EC4E8" opacity="0.07"/>
  <path d="M222 290c10-12 32-10 40 4s2 30-12 34-32-8-34-22 2-10 6-16z" fill="#9EC4E8" opacity="0.05"/>

  <!-- 视野环 -->
  <circle cx="256" cy="250" r="126" fill="none" stroke="#1D2B40" stroke-width="26"/>

  <!-- 追溯轨迹：高亮弧（视野环右侧被点亮的一段） -->
  <path d="M309.2 135.8 A 126 126 0 0 1 309.2 364.2"
        fill="none" stroke="url(#rt-trace)" stroke-width="26" stroke-linecap="round" filter="url(#rt-soft)"/>

  <!-- 命中的证据 -->
  <circle cx="309" cy="364" r="48" fill="url(#rt-hit-glow)"/>
  <circle cx="309" cy="364" r="19" fill="#FBBF24"/>
  <circle cx="303" cy="358" r="6" fill="#FFF3D6" opacity="0.85"/>

  <!-- 中心十字准星 -->
  <g stroke="#7FA0C0" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="206" x2="256" y2="232"/>
    <line x1="256" y1="268" x2="256" y2="294"/>
    <line x1="212" y1="250" x2="238" y2="250"/>
    <line x1="274" y1="250" x2="300" y2="250"/>
  </g>
  <circle cx="256" cy="250" r="7" fill="#7FA0C0" opacity="0.9"/>

  <!-- 证据链：命中点向外分叉到知识节点 -->
  <g stroke="#38BDF8" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <path d="M325 373 L394 407"/>
    <path d="M323 349 L398 322"/>
  </g>
  <circle cx="401" cy="412" r="14" fill="#0A101B" stroke="#38BDF8" stroke-width="5"/>
  <circle cx="401" cy="412" r="5" fill="#7DD3FC"/>
  <circle cx="404" cy="318" r="10" fill="#0A101B" stroke="#5AA9E8" stroke-width="5"/>
  <circle cx="404" cy="318" r="3.5" fill="#7DD3FC" opacity="0.8"/>
</svg>
