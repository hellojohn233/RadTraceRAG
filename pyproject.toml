[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radtracerag"
version = "0.1.0"
description = "Evidence-grounded multimodal RAG for medical image questions"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "lightrag-hku>=1.5.7,<1.6",
    "streamlit>=1.40",
    # 演示影像用程序合成，需要 numpy 算灰度场、pillow 做高斯模糊与保存
    "numpy>=1.26",
    "pillow>=10.0",
    # API 层：React 前端通过 HTTP 取答案与证据
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # LightRAG 的 Milvus 向量存储后端
    "pymilvus>=2.4",
    # 模型统一走 OpenAI 兼容接口（vLLM / Ollama / LM Studio / 云服务）
    "openai>=1.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    # assets/make_lockup_svg.py 用它把字形排版成矢量轮廓
    "uharfbuzz>=0.39",
]

[project.scripts]
radtracerag = "radtracerag.cli:main"
radtracerag-ui = "radtracerag.ui.launch:main"
radtracerag-api = "radtracerag.api.launch:main"

[tool.hatch.build.targets.wheel]
packages = ["src/radtracerag"]
