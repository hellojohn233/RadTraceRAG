[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radtracerag"
version = "0.1.0"
description = "Evidence-grounded multimodal RAG for medical image questions"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "lightrag-hku>=1.5.7,<1.6",
    "numpy>=2.4.6",
    "openai>=1.60",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "streamlit>=1.40",
    "tiktoken>=0.9",
]

[project.scripts]
radtracerag = "radtracerag.cli:main"
radtracerag-ui = "radtracerag.ui.launch:main"

[tool.hatch.build.targets.wheel]
packages = ["src/radtracerag"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
