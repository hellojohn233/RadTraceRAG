# Streamlit 主题配置。
#
# 界面走纸面路线：米白纸底、墨色字、朱砂强调。
# 这里的值会被 Streamlit 注入成 CSS 变量（--primary-color 等），
# 比在 CSS 里硬改可靠：内部组件（radio / slider）的颜色从这里派生。

[theme]
base = "light"
primaryColor = "#C0472B"
backgroundColor = "#FBFAF7"
secondaryBackgroundColor = "#F1EFE9"
textColor = "#16202E"
font = "sans serif"

[server]
headless = true
fileWatcherType = "auto"
